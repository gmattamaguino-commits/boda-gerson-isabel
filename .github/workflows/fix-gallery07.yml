name: Fix gallery 07 image

on:
  push:
    paths:
      - '.gallery-fix/**'
      - '.github/workflows/fix-gallery07.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct image
        run: |
          cat .gallery-fix/chunk-* > /tmp/gallery07.b64
          base64 -d /tmp/gallery07.b64 > img/galeria-07-full.webp
          cp img/galeria-07-full.webp img/galeria-07-thumb.webp
          file img/galeria-07-full.webp
          test "$(stat -c%s img/galeria-07-full.webp)" -gt 70000

      - name: Commit fixed image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/galeria-07-full.webp img/galeria-07-thumb.webp
          git commit -m "[skip ci] Corrige foto 07 de galería" || exit 0
          git push
