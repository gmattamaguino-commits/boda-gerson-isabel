name: Cache bust gallery 07

on:
  push:
    paths:
      - '.github/workflows/cache-bust-gallery07.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update gallery 07 asset URLs
        run: |
          sed -i 's#data-full="img/galeria-07-full.webp"#data-full="img/galeria-07-full.webp?v=20260826fix2"#' index.html
          sed -i 's#src="img/galeria-07-thumb.webp"#src="img/galeria-07-thumb.webp?v=20260826fix2"#' index.html
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[skip ci] Fuerza recarga de foto 07 de galería" || exit 0
          git push
